name: Rotate the Vault flag epochs

# ---------------------------------------------------------------------------
# Flags a fresh epoch on a schedule, using the database's own vault.rotate().
#
# This replaces the Render Background Worker: no fourth Render service, no
# instance slot burned, and the rotation log is inspectable in the Actions tab.
#
# It connects as the DATABASE OWNER (the credentials in the External Database
# URL), which is guaranteed to have permission to call vault.rotate(). If you
# later want to run it as the narrower vault_rotator role, set the four
# VAULT_ROTATOR_* variables and it will build that URL instead.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 * * * *"       # every hour, on the hour
  workflow_dispatch:          # so you can trigger it by hand to test

concurrency:
  group: vault-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          if [ -z "$RENDER_DATABASE_URL" ]; then
            echo "::error::Add the RENDER_DATABASE_URL secret first."
            echo "::error::It is the External Database URL from your Render"
            echo "::error::PostgreSQL dashboard (the one containing"
            echo "::error::hidimbi_vault_user, ending in onrender.com)."
            exit 1
          fi
          echo "[*] database URL present"

      - name: Build the connection string
        id: dsn
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          ROTATOR_URL: ${{ secrets.VAULT_ROTATOR_URL }}
        run: |
          # Prefer the narrowly-scoped rotator role when it has been set up;
          # otherwise fall back to the database owner.
          if [ -n "$ROTATOR_URL" ]; then
            echo "target=rotator" >> "$GITHUB_OUTPUT"
            echo "url=$ROTATOR_URL" >> "$GITHUB_OUTPUT"
            echo "[*] using the vault_rotator role"
          else
            echo "target=owner" >> "$GITHUB_OUTPUT"
            echo "url=$RENDER_DATABASE_URL" >> "$GITHUB_OUTPUT"
            echo "[*] VAULT_ROTATOR_URL not set; using the database owner"
          fi

      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Rotate all epochs
        env:
          TARGET_URL: ${{ steps.dsn.outputs.url }}
          INSTANCE_ID: ${{ vars.HIDIMBI_INSTANCE_ID }}
          TEAM_ID: ${{ vars.HIDIMBI_TEAM_ID }}
          FLAG_TTL_HOURS: ${{ vars.HIDIMBI_FLAG_TTL_HOURS }}
        run: |
          set -euo pipefail
          EPOCH=$(psql "$TARGET_URL" -Atq -v ON_ERROR_STOP=1 -c \
            "SELECT vault.rotate('${INSTANCE_ID:-hidimbi-main}',
                                 '${TEAM_ID:-solo}',
                                 ${FLAG_TTL_HOURS:-24});")
          echo "[*] rotated to epoch ${EPOCH:-1}"

      - name: Report live epochs (never prints a flag value)
        env:
          TARGET_URL: ${{ steps.dsn.outputs.url }}
        run: |
          echo "[*] live rows (instance | team | epoch | expired | consumed):"
          psql "$TARGET_URL" -Atq -F ' | ' -c \
            "SELECT instance_id, team_id, epoch_id,
                    (expires_at < now()) AS expired, consumed
               FROM vault.flag_instances
              ORDER BY epoch_id;"
          echo "[*] total redemptions:"
          psql "$TARGET_URL" -Atq -c \
            "SELECT count(*) FROM vault.flag_redemptions;"

      - name: Warn on failure
        if: failure()
        run: |
          echo "::warning::Rotation failed. The previous epoch stays valid,"
          echo "::warning::so old selectors keep working until this is fixed."
